<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>BlackAngels — Clan Command</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070708;--card:#141316;--line:#2e2820;--gold:#c0985a;--gold2:#e8c27a;--red:#8a1c1c;--red2:#c0392b;--tx:#e6e1d6;--mu:#8c877c;--f:Cinzel,"Trajan Pro",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 0%,#2a0c0c 0%,transparent 55%),radial-gradient(ellipse at 100% 100%,#1d1508 0%,transparent 50%),var(--bg);background-attachment:fixed}
body{display:flex;min-height:100vh}
nav{width:200px;background:linear-gradient(180deg,#1a0d0d,#0c0b0c 40%,#0c0b0c);border-right:1px solid #4a3a22;box-shadow:inset -1px 0 0 #000,4px 0 24px #000a;padding:14px 10px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font:900 14px var(--f);color:var(--gold2);letter-spacing:3px;margin:6px 4px 18px;text-align:center;text-shadow:0 0 12px #8a1c1c;border-bottom:1px solid #4a3a22;padding-bottom:14px}nav h1 small{display:block;font:500 9px var(--f);color:var(--mu);letter-spacing:4px;margin-top:4px;text-transform:uppercase}nav h1 svg{filter:drop-shadow(0 0 8px #8a1c1c);margin-bottom:6px}nav button{font-family:var(--f)!important;letter-spacing:1px;font-size:13px!important}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:9px 10px;border-radius:4px;cursor:pointer;font:inherit;margin-bottom:2px}
nav button.on,nav button:hover{background:linear-gradient(90deg,#3a1212,transparent);color:var(--gold2);box-shadow:inset 3px 0 0 var(--red2)}
main{flex:1;padding:18px;min-width:0}
h2{font:700 22px var(--f);letter-spacing:2px;color:var(--gold2);margin:0 0 18px;text-shadow:0 0 14px #5a1010;display:flex;align-items:center;gap:12px}h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}h3{margin:0 0 10px;color:var(--gold);font:700 13px var(--f);letter-spacing:1.5px;text-transform:uppercase}
.card{position:relative;background:linear-gradient(160deg,#1a1719,#101012);border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px #000a,inset 0 0 0 1px #0008}.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:solid var(--gold);pointer-events:none}.card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k b{display:block;font:900 26px var(--f);color:var(--gold2);text-shadow:0 0 14px #8a1c1c}.k span{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
button.b,input,select,textarea{background:#1c1c21;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font:inherit}
button.b{cursor:pointer;border-color:var(--gold);color:var(--gold2);background:linear-gradient(180deg,#2a2114,#17120a);font-family:var(--f);font-size:12px;letter-spacing:1px;text-transform:uppercase}button.b.r{border-color:var(--red);color:#e07a6a;background:linear-gradient(180deg,#2a1010,#160808)}button.b:hover{filter:brightness(1.35);box-shadow:0 0 10px #8a1c1c88}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--gold);cursor:pointer;font:700 11px var(--f);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #4a3a22}tr:hover td{background:#1c1416}tr.off td{opacity:.5}
.hb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}.hb i{display:block;height:10px;background:linear-gradient(90deg,var(--red),var(--red2) 55%,var(--gold2));border-radius:1px;box-shadow:0 0 8px #8a1c1c99}.hb span{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis}
.slot{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12px}.slot.e{color:var(--mu)}
.mu{color:var(--mu)}a{color:var(--gold)}
dialog{background:linear-gradient(160deg,#1c1618,#0f0e10);color:var(--tx);border:1px solid var(--gold);border-radius:3px;box-shadow:0 0 40px #8a1c1c77;max-width:94vw;width:420px}dialog::backdrop{background:#000a}
dialog label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}dialog input,dialog select,dialog textarea{width:100%}
#toast{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#222;border:1px solid var(--gold);padding:9px 14px;border-radius:4px;display:none;z-index:9}
#lock{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a0e0e,#070708 70%);text-align:center;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;z-index:5;display:flex;overflow-x:auto;padding:6px;gap:2px}nav h1{display:none}nav button{width:auto;white-space:nowrap}}
</style><style>

*{scrollbar-width:thin;scrollbar-color:#4a1d8c #0b0a0e}
html{background:#050507!important}body{background:transparent!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#050507ee,#0b0612cc 45%,#050507f5),var(--img) center top/cover no-repeat}
.metal{background:linear-gradient(180deg,#fff 0%,#cfc8dc 40%,#7a7390 52%,#e6e0f0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 6px #000)}
nav{background:linear-gradient(180deg,#140b20,#09080c 45%)!important;border-right:1px solid #3b2d52!important;box-shadow:6px 0 30px #000c!important}
nav::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#9a5cff,transparent);opacity:.6}
.crest{width:100%;aspect-ratio:300/92;background:var(--crest) center/contain no-repeat;margin-bottom:6px;filter:drop-shadow(0 0 10px #6b2fd0);mix-blend-mode:lighten}
nav h1{text-shadow:none!important;border-bottom:1px solid #3b2d52!important}
nav h1 .metal{display:block;font:900 16px var(--f);letter-spacing:3px}
nav h1 small{letter-spacing:1px!important;font-size:8px!important;color:#8f88a0!important}
nav button.on,nav button:hover{background:linear-gradient(90deg,#2a1450,transparent)!important;box-shadow:inset 3px 0 0 #9a5cff!important;color:#fff!important}
h2{text-shadow:0 0 16px #6b2fd088!important}h2::before{content:"◆";color:#9a5cff;font-size:12px;text-shadow:0 0 8px #9a5cff}
h2::after{background:linear-gradient(90deg,#b4a8cc,#4a1d8c,transparent)!important}
h3::before{content:"◆ ";color:#9a5cff}
.card{background:linear-gradient(160deg,#17121d,#0b0a0e)!important;border-color:#33293f!important;box-shadow:0 6px 24px #000c,inset 0 1px 0 #ffffff0d!important}
.card::before,.card::after{border-color:#b4a8cc!important;width:16px!important;height:16px!important}.card:hover{border-color:#5b3d8f!important}
.k b{background:linear-gradient(180deg,#fff,#b4a8cc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none!important;filter:drop-shadow(0 0 10px #7b3fe4)}
button.b{background:linear-gradient(180deg,#2b2538,#15121c)!important;border-color:#8a7fa3!important;color:#efe9fa!important}
button.b:hover{box-shadow:0 0 14px #7b3fe499!important;border-color:#9a5cff!important;filter:none!important}
button.b.r{background:linear-gradient(180deg,#3a1018,#1a080c)!important;border-color:#8a2030!important;color:#ff9a9a!important}button.b.r:hover{box-shadow:0 0 14px #c0213a88!important;border-color:#c0213a!important}
input,select,textarea{background:#0e0c12!important;border-color:#3a2f4a!important}input:focus,select:focus,textarea:focus{outline:none;border-color:#9a5cff!important;box-shadow:0 0 8px #7b3fe477}
th{color:#b4a8cc!important;border-bottom-color:#4a3a66!important}tr:hover td{background:#1a1226!important}
.hb i{background:linear-gradient(90deg,#3b1578,#9a5cff 70%,#efe9fa)!important;box-shadow:0 0 10px #7b3fe4aa!important}
dialog{border-color:#8a7fa3!important;background:linear-gradient(160deg,#17121d,#0a090d)!important;box-shadow:0 0 50px #6b2fd066!important}dialog::backdrop{background:#000c!important;backdrop-filter:blur(3px)}
#toast{border-color:#9a5cff!important;background:#120d1a!important}
.hero{position:relative;height:250px;margin-bottom:16px;border:1px solid #4a3a66;border-radius:3px;overflow:hidden;background:var(--img) center 18%/cover no-repeat;box-shadow:0 8px 30px #000c,0 0 30px #4a1d8c55}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#050507f0 96%),radial-gradient(ellipse at center,transparent 40%,#000a)}
.hero .ht{position:absolute;left:0;right:0;bottom:12px;text-align:center}.hero .ht b{display:block;font:900 38px var(--f);letter-spacing:8px}.hero .ht span{font:500 11px var(--f);letter-spacing:5px;color:#b4a8cc}
#lock{background:#050507!important;overflow:hidden;justify-content:flex-end!important;padding-bottom:7vh}
#lock::before{content:"";position:absolute;inset:0;background:var(--img) center/cover;filter:blur(22px) brightness(.4)}
#lock::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,#050507 100%),var(--img) center top/auto min(92vh,100vw) no-repeat}
#lock>*{position:relative;z-index:2}#lock svg,#lock h2,#lock span{display:none}#lock input{width:220px;text-align:center;letter-spacing:6px}

#lock::after{display:none!important}

</style></head><body>
<div id="lock"><div class="lw"><div class="lart"></div><div class="lpn"><div class="lt metal">BLACKANGELS</div><div class="ls">Central de Comando</div><div class="lsep">◆</div>
<label>Login</label><input id="lu" autocomplete="username" placeholder="Seu login" onkeydown="if(event.key==='Enter')$('#pin').focus()">
<label>Senha</label><div class="pw"><input id="pin" type="password" autocomplete="current-password" placeholder="Sua senha" onkeydown="if(event.key==='Enter')unlock()"><button type="button" class="eye" onclick="const p=$('#pin');p.type=p.type=='password'?'text':'password';this.textContent=p.type=='password'?'Mostrar':'Ocultar'">Mostrar</button></div>
<div id="lerr" class="lm" style="color:#ff8a8a;min-height:14px;margin-top:6px"></div><button class="b lgo" onclick="unlock()">Entrar</button><div class="lm">Acesso restrito aos administradores</div></div></div></div>
<nav id="nav"></nav><main id="m"><p class="mu">Carregando…</p></main><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const CL=['Bárbaro','Cruzado','Caçador de Demônios','Monge','Necromante','Arcanista','Cavaleiro de Sangue','Tempestário','Druida','Bruxo'];
const CAP=[8,8,8,4,4,4,2,2,2,1,1,1],ST=['Pendente','Presente','Ausente','Justificado'];
const NAV=[['dash','Dashboard'],['wars','Guerras'],['mem','Membros'],['teams','Times'],['att','Frequência'],['cfg','Gestão'],['bkp','Backup']];
let db,D={members:[],wars:[],lineups:[],attend:[]},view='dash',F={q:'',c:'',lv:'',rs:'',rk:'',dp:'',sort:'nome',dir:1},W=null,AF={c:'',from:'',to:'',pf:null};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const opn=()=>new Promise((r,j)=>{const q=indexedDB.open('clancommand',1);q.onupgradeneeded=()=>{['members','wars','lineups','attend','meta'].forEach(n=>q.result.createObjectStore(n,{keyPath:'id'}))};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const st=(n,m)=>db.transaction(n,m).objectStore(n);
const getAll=n=>new Promise(r=>{const q=st(n).getAll();q.onsuccess=()=>r(q.result)});
const getOne=(n,id)=>new Promise(r=>{const q=st(n).get(id);q.onsuccess=()=>r(q.result)});
const put=(n,o)=>new Promise((r,j)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).put(o);t.oncomplete=r;t.onerror=()=>{toast('Erro ao salvar');j()}});
const rm=(n,id)=>new Promise(r=>{const t=db.transaction(n,'readwrite');t.objectStore(n).delete(id);t.oncomplete=r});
async function load(){for(const n in D)D[n]=await getAll(n);G=Object.assign({},DEFG,(await getOne('meta','gestao'))||{})}
const mem=id=>D.members.find(m=>m.id==id),war=id=>D.wars.find(w=>w.id==id);
const fmtD=w=>w?new Date(w.data+'T'+(w.hora||'00:00')).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
function form(title,fields,vals,cb){const d=$('#dlg');d.innerHTML=`<h3>${title}</h3>`+fields.map(f=>`<label>${f.l}</label>`+(f.o?`<select name="${f.k}">${f.o.map(o=>`<option ${o==vals[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="3">${esc(vals[f.k]||'')}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(vals[f.k]??'')}">`)).join('')+`<div class="bar" style="margin-top:14px"><button class="b" id="ok">Salvar</button><button class="b r" id="no">Cancelar</button></div>`;
d.showModal();$('#no').onclick=()=>d.close();$('#ok').onclick=async()=>{const o={};d.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value.trim());const err=cb(o);if(err)return toast(err);d.close()}}
const ask=(t,fn)=>{if(confirm(t))fn()};
/* ---------- membros ---------- */
function memForm(m){m=m||{};form(m.id?'Editar membro':'Novo membro',[{k:'nome',l:'Nome'},{k:'nivel',l:'Nível',t:'number'},{k:'classe',l:'Classe',o:CL},{k:'res',l:'Ressonância',t:'number'},{k:'ranque',l:'Ranque'},{k:'disp',l:'Disponibilidade',o:['Sim','Não']},{k:'ativo',l:'Status',o:['Ativo','Inativo']}],{...m,ativo:m.ativo===false?'Inativo':'Ativo'},o=>{
if(!o.nome)return'Nome obrigatório';if(D.members.some(x=>x.id!=m.id&&x.nome.toLowerCase()==o.nome.toLowerCase()))return'Já existe membro com esse nome';
const n={id:m.id||uid(),nome:o.nome,nivel:+o.nivel||0,classe:o.classe,res:+o.res||0,ranque:o.ranque,disp:o.disp,ativo:o.ativo=='Ativo'};if(n.nivel<0||n.res<0)return'Valores inválidos';
put('members',n).then(async()=>{await load();render();toast('Membro salvo')})}) }
function memRows(){let r=D.members.filter(m=>(!F.q||m.nome.toLowerCase().includes(F.q.toLowerCase()))&&(!F.c||m.classe==F.c)&&(!F.lv||m.nivel>=+F.lv)&&(!F.rs||m.res>=+F.rs)&&(!F.rk||(m.ranque||'').toLowerCase().includes(F.rk.toLowerCase()))&&(!F.dp||m.disp==F.dp));
return r.sort((a,b)=>(a[F.sort]>b[F.sort]?1:a[F.sort]<b[F.sort]?-1:0)*F.dir)}
function vMem(){const rows=memRows();const inp=(k,p,t)=>`<input placeholder="${p}" type="${t||'text'}" value="${esc(F[k])}" oninput="F.${k}=this.value;memTbl()" style="width:110px">`;
return`<h2>Membros</h2><div class="bar"><button class="b" onclick="memForm()">+ Novo</button><button class="b" onclick="$('#csv').click()">Importar arquivo CSV</button><button class="b" onclick="pasteCSV()">Colar CSV</button><input id="csv" type="file" accept=".csv" hidden onchange="impCSV(this.files[0])"><button class="b r" onclick="F={q:'',c:'',lv:'',rs:'',rk:'',dp:'',sort:'nome',dir:1};render()">Limpar filtros</button></div>
<div class="bar">${inp('q','Buscar nome')}<select onchange="F.c=this.value;memTbl()"><option value="">Classe</option>${CL.map(c=>`<option ${F.c==c?'selected':''}>${c}</option>`).join('')}</select>${inp('lv','Nível ≥','number')}${inp('rs','Ressonância ≥','number')}${inp('rk','Ranque')}<select onchange="F.dp=this.value;memTbl()"><option value="">Disponib.</option><option ${F.dp=='Sim'?'selected':''}>Sim</option><option ${F.dp=='Não'?'selected':''}>Não</option></select></div>
<div class="card tw" id="mt"></div><p class="mu">Formato: [#,]nome,nível,classe,ressonância,ranque[,disponibilidade]. A coluna de posição (#) no início é ignorada.</p>`}
function memTbl(){const rows=memRows();const h=(k,l)=>`<th onclick="F.dir=F.sort=='${k}'?-F.dir:1;F.sort='${k}';memTbl()">${l}${F.sort==k?(F.dir>0?' ▲':' ▼'):''}</th>`;
$('#mt').innerHTML=rows.length?`<table><tr>${h('nome','Nome')}${h('nivel','Nível')}${h('classe','Classe')}${h('res','Ress.')}${h('ranque','Ranque')}${h('disp','Disp.')}${h('ativo','Status')}<th></th></tr>${rows.map(m=>`<tr class="${m.ativo?'':'off'}"><td><a href="#" onclick="prof('${m.id}');return false">${esc(m.nome)}</a></td><td>${m.nivel}</td><td>${m.classe}</td><td>${m.res}</td><td>${esc(m.ranque)}</td><td>${m.disp}</td><td>${m.ativo?'Ativo':'Inativo'}</td><td><button class="b" onclick="memForm(mem('${m.id}'))">Editar</button> <button class="b" onclick="tgl('${m.id}')">${m.ativo?'Inativar':'Ativar'}</button> <button class="b r" onclick="delM('${m.id}')">Excluir</button></td></tr>`).join('')}</table>`:'<p class="mu">Nenhum membro encontrado. Cadastre um membro ou importe um CSV.</p>'}
async function tgl(id){const m=mem(id);m.ativo=!m.ativo;await put('members',m);await load();memTbl()}
function delM(id){const used=D.lineups.some(l=>l.teams.some(t=>t.some(s=>s.mid==id)))||D.attend.some(a=>id in a.r);ask(used?'Este membro tem histórico em guerras. Excluir apaga a referência dele no histórico. Prefira INATIVAR. Excluir mesmo assim?':'Excluir membro?',async()=>{await rm('members',id);await load();memTbl();toast('Excluído')})}
function impCSV(f){if(!f)return;const r=new FileReader();r.onload=()=>runCSV(r.result);r.readAsText(f)}
function pasteCSV(){const d=$('#dlg');d.innerHTML='<h3>Colar CSV</h3><label>Cole as linhas: nome, nível, classe, ressonância, ranque (disponibilidade opcional). Uma coluna de posição (#) no início é ignorada. Aceita separador ; , ou tab (cópia direta da planilha). A linha de cabeçalho é opcional.</label><textarea id="pt" rows="9" placeholder="Nome;Nivel;Classe;Ressonancia;Ranque;Disponibilidade&#10;Kael;60;Bárbaro;7200;Lenda;Sim"></textarea><div class="bar" style="margin-top:14px"><button class="b" id="pok">Importar</button><button class="b r" id="pno">Cancelar</button></div>';d.showModal();$('#pno').onclick=()=>d.close();$('#pok').onclick=()=>{const t=$('#pt').value.trim();if(!t)return toast('Cole o conteúdo primeiro');d.close();runCSV(t)}}
const nz=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\./g,'').trim();
const CAL={'cav sangrento':'Cavaleiro de Sangue','cav de sangue':'Cavaleiro de Sangue','cavaleiro sangrento':'Cavaleiro de Sangue','cacador':'Caçador de Demônios'};
const findCl=s=>{const k=nz(s);return CL.find(x=>nz(x)==k)||CAL[k]};
async function runCSV(txt){let n=0;const bad=[],L=txt.split(/\r?\n/).filter(l=>l.trim());if(L.length&&!/\d/.test(L[0]))L.shift();
for(let i=0;i<L.length;i++){let c=L[i].split(/[;,\t]/).map(x=>x.trim());const ix=/^\d+$/.test(c[0])&&c.length>=5,pos=ix?c[0]:String(i+1);if(ix)c=c.slice(1);
let nome=c[0]||'';if(!/[\p{L}\p{N}]/u.test(nome))nome='Membro '+pos;
const cl=findCl(c[2]);if(!cl){bad.push(nome+': classe "'+c[2]+'" não reconhecida');continue}
if(D.members.some(m=>m.nome.toLowerCase()==nome.toLowerCase())){bad.push(nome+': nome já cadastrado');continue}
const m={id:uid(),nome,nivel:+c[1]||0,classe:cl,res:+c[3]||0,ranque:c[4]||'',disp:/^n/i.test(c[5]||'')?'Não':'Sim',ativo:true};await put('members',m);D.members.push(m);n++}
render();toast(n+' importados, '+bad.length+' ignorados');
if(bad.length){const d=$('#dlg');d.innerHTML='<h3>Linhas ignoradas ('+bad.length+')</h3><div style="max-height:50vh;overflow:auto">'+bad.map(b=>'<div class="mu">'+esc(b)+'</div>').join('')+'</div><div class="bar" style="margin-top:12px"><button class="b" onclick="$(\'#dlg\').close()">Fechar</button></div>';d.showModal()}}
/* ---------- guerras ---------- */
function warForm(w){w=w||{};form(w.id?'Editar guerra':'Nova guerra',[{k:'nome',l:'Nome/Identificação'},{k:'data',l:'Data',t:'date'},{k:'hora',l:'Horário',t:'time'},{k:'status',l:'Status',o:['agendada','realizada','cancelada']},{k:'res',l:'Resultado',o:['não informado','vitória','derrota']},{k:'obs',l:'Observações',t:'area'}],w,o=>{if(!o.nome||!o.data)return'Nome e data obrigatórios';
put('wars',{id:w.id||uid(),...o}).then(async()=>{await load();render();toast('Guerra salva')})})}
function vWars(){const L=[...D.wars].sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));return`<h2>Guerras</h2><div class="bar"><button class="b" onclick="warForm()">+ Nova guerra</button></div><div class="card tw">${L.length?`<table><tr><th>Nome</th><th>Data</th><th>Status</th><th>Resultado</th><th>Escalados</th><th>Presentes</th><th></th></tr>${L.map(w=>{const ln=D.lineups.find(l=>l.id==w.id),a=D.attend.find(x=>x.id==w.id);return`<tr><td>${esc(w.nome)}</td><td>${fmtD(w)}</td><td>${w.status}</td><td>${w.res}</td><td>${ln?ln.teams.flat().length:0}/45</td><td>${a?Object.values(a.r).filter(v=>v=='Presente').length:0}</td><td><button class="b" onclick="warForm(war('${w.id}'))">Editar</button> <button class="b" onclick="W='${w.id}';go('teams')">Times</button> <button class="b" onclick="W='${w.id}';go('att')">Frequência</button> <button class="b r" onclick="delW('${w.id}')">Excluir</button></td></tr>${w.obs?`<tr><td colspan="7" class="mu">${esc(w.obs)}</td></tr>`:''}`}).join('')}</table>`:'<p class="mu">Nenhuma guerra cadastrada.</p>'}</div>`}
function delW(id){ask('Excluir guerra com times e frequência? Não dá para desfazer.',async()=>{await rm('wars',id);await rm('lineups',id);await rm('attend',id);await load();render()})}
const wsel=()=>`<select onchange="W=this.value;render()"><option value="">Selecione a guerra</option>${[...D.wars].sort((a,b)=>b.data.localeCompare(a.data)).map(w=>`<option value="${w.id}" ${W==w.id?'selected':''}>${esc(w.nome)} — ${fmtD(w)}</option>`).join('')}</select>`;
/* ---------- times ---------- */
async function getLn(){let l=D.lineups.find(x=>x.id==W);if(!l){l={id:W,teams:Array.from({length:12},()=>[]),log:[]};D.lineups.push(l)}return l}
const snap=m=>({n:m.nome,l:m.nivel,c:m.classe,r:m.res,k:m.ranque});
async function tAdd(t,mid){if(!mid)return;const l=await getLn();if(l.teams.flat().some(s=>s.mid==mid))return toast('Membro já escalado nesta guerra');if(l.teams[t].length>=CAP[t])return toast('Time cheio');l.teams[t].push({mid,snap:snap(mem(mid))});l.log.push(new Date().toISOString()+' +'+mem(mid).nome+' T'+(t+1));await put('lineups',l);render()}
async function tRm(t,i){const l=await getLn();const s=l.teams[t].splice(i,1)[0];l.log.push(new Date().toISOString()+' -'+s.snap.n+' T'+(t+1));await put('lineups',l);render()}
async function tMv(t,i,to){to=+to;const l=await getLn();if(l.teams[to].length>=CAP[to])return toast('Time de destino cheio'),render();const s=l.teams[t].splice(i,1)[0];l.teams[to].push(s);l.log.push(new Date().toISOString()+' '+s.snap.n+' T'+(t+1)+'→T'+(to+1));await put('lineups',l);render()}
function vTeams(){let h=`<h2>Times</h2><div class="bar">${wsel()}</div>`;if(!W||!war(W))return h+'<p class="mu">Selecione uma guerra para montar os times.</p>';
const l=D.lineups.find(x=>x.id==W)||{teams:Array.from({length:12},()=>[])},used=new Set(l.teams.flat().map(s=>s.mid));
const free=D.members.filter(m=>m.ativo&&!used.has(m.id)).sort((a,b)=>a.nome.localeCompare(b.nome));
h+=`<div class="bar"><input placeholder="Filtrar lista por nome" oninput="TQ=this.value;render()" value="${esc(window.TQ||'')}"><select onchange="TC=this.value;render()"><option value="">Todas as classes</option>${CL.map(c=>`<option ${window.TC==c?'selected':''}>${c}</option>`).join('')}</select><span class="mu">${free.length} livres · ${l.teams.flat().length}/45 vagas</span></div><div class="g2">`;
const fl=free.filter(m=>(!window.TQ||m.nome.toLowerCase().includes(TQ.toLowerCase()))&&(!window.TC||m.classe==TC));
l.teams.forEach((t,i)=>{const tot=t.reduce((a,s)=>a+s.snap.r,0);h+=`<div class="card"><h3>Time ${i+1} (${t.length}/${CAP[i]}) <span class="mu">Σ ${tot} · μ ${t.length?Math.round(tot/t.length):0}</span></h3>${t.map((s,j)=>`<div class="slot"><span>${esc(s.snap.n)} <span class="mu">${s.snap.c} · Nv ${s.snap.l} · ${s.snap.r}</span></span><span><select onchange="tMv(${i},${j},this.value)" style="width:62px"><option>↔</option>${CAP.map((_,k)=>k==i?'':`<option value="${k}">T${k+1}</option>`).join('')}</select> <button class="b r" onclick="tRm(${i},${j})">×</button></span></div>`).join('')}
${t.length<CAP[i]?`<select onchange="tAdd(${i},this.value)" style="width:100%;margin-top:6px"><option value="">+ adicionar (${CAP[i]-t.length} vaga(s))</option>${fl.map(m=>`<option value="${m.id}">${esc(m.nome)} · ${m.classe} · Nv ${m.nivel} · ${m.res}${m.disp=='Não'?' (indisp.)':''}</option>`).join('')}</select>`:''}</div>`});return h+'</div>'}
/* ---------- frequência ---------- */
function stats(mid,wl){let p=0,a=0,j=0;for(const w of wl){const r=(D.attend.find(x=>x.id==w.id)||{r:{}}).r[mid];if(r=='Presente')p++;else if(r=='Ausente')a++;else if(r=='Justificado')j++}return{p,a,j,t:wl.length,pc:p+a?Math.round(p/(p+a)*100):null}}
const doneWars=()=>D.wars.filter(w=>w.status=='realizada'&&(!AF.from||w.data>=AF.from)&&(!AF.to||w.data<=AF.to));
async function setAtt(mid,v){let a=D.attend.find(x=>x.id==W);if(!a){a={id:W,r:{},snap:{}};D.attend.push(a)}a.r[mid]=v;a.snap=a.snap||{};a.snap[mid]=mem(mid).nome;await put('attend',a);toast('Salvo');att2()}
function vAtt(){return`<h2>Frequência</h2><div class="bar">${wsel()}</div><div id="at"></div>`}
function att2(){const cur=W&&war(W)?`<div class="card tw"><h3>Registro da guerra</h3><table><tr><th>Membro</th><th>Classe</th><th>Status</th></tr>${D.members.filter(m=>m.ativo&&(!AF.c||m.classe==AF.c)).map(m=>{const v=((D.attend.find(x=>x.id==W)||{r:{}}).r[m.id])||'Pendente';return`<tr><td>${esc(m.nome)}</td><td>${m.classe}</td><td><select onchange="setAtt('${m.id}',this.value)">${ST.map(s=>`<option ${s==v?'selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join('')}</table></div>`:'<p class="mu">Selecione uma guerra para registrar presenças.</p>';
const wl=doneWars(),rk=D.members.filter(m=>!AF.c||m.classe==AF.c).map(m=>({m,...stats(m.id,wl)})).filter(r=>r.t&&(r.m.ativo||r.p+r.a+r.j>0));
const top=[...rk].sort((a,b)=>b.p-a.p),pc=[...rk].filter(r=>r.pc!=null).sort((a,b)=>b.pc-a.pc);
const bar=(L,f)=>L.slice(0,5).map(r=>`<div class="hb"><span>${esc(r.m.nome)}</span><i style="width:${Math.max(2,f(r))}px"></i>${f(r)>=0?r.p+' pres':''} ${r.pc!=null?r.pc+'%':''}</div>`).join('')||'<p class="mu">Sem dados.</p>';
$('#at').innerHTML=`<div class="bar"><select onchange="AF.c=this.value;att2()"><option value="">Todas as classes</option>${CL.map(c=>`<option ${AF.c==c?'selected':''}>${c}</option>`).join('')}</select>De <input type="date" value="${AF.from}" onchange="AF.from=this.value;att2()"> até <input type="date" value="${AF.to}" onchange="AF.to=this.value;att2()"></div>${cur}
<div class="g2"><div class="card"><h3>Mais participações</h3>${bar(top,r=>r.p*10)}</div><div class="card"><h3>Menos participações</h3>${bar([...top].reverse(),r=>r.p*10)}</div><div class="card"><h3>Maior % de presença</h3>${bar(pc,r=>r.pc)}</div></div>
<div class="card tw"><h3>Indicadores (guerras realizadas no período)</h3><table><tr><th>Membro</th><th>Guerras</th><th>Pres.</th><th>Aus.</th><th>Just.</th><th>%</th></tr>${rk.map(r=>`<tr><td><a href="#" onclick="prof('${r.m.id}');return false">${esc(r.m.nome)}</a></td><td>${r.t}</td><td>${r.p}</td><td>${r.a}</td><td>${r.j}</td><td>${r.pc==null?'—':r.pc+'%'}</td></tr>`).join('')}</table></div>`}
function prof(id){const m=mem(id),d=$('#dlg');const rows=[...D.wars].sort((a,b)=>b.data.localeCompare(a.data)).map(w=>{const a=D.attend.find(x=>x.id==w.id),l=D.lineups.find(x=>x.id==w.id),s=l&&l.teams.flat().find(x=>x.mid==id);return(a&&a.r[id])||s?`<tr><td>${esc(w.nome)}</td><td>${w.data}</td><td>${(a&&a.r[id])||'—'}</td><td>${s?`T${l.teams.findIndex(t=>t.includes(s))+1} · Nv ${s.snap.l} · ${s.snap.r}`:'—'}</td></tr>`:''}).join('');
const s=stats(id,D.wars.filter(w=>w.status=='realizada'));d.innerHTML=`<h3>${esc(m.nome)} ${m.ativo?'':'(inativo)'}</h3><p class="mu">${m.classe} · Nv ${m.nivel} · Ress. ${m.res} · ${esc(m.ranque)}</p><p>Presenças ${s.p} · Ausências ${s.a} · Justif. ${s.j} · ${s.pc==null?'—':s.pc+'%'}</p><div class="tw"><table><tr><th>Guerra</th><th>Data</th><th>Freq.</th><th>Snapshot</th></tr>${rows||'<tr><td colspan="4" class="mu">Sem histórico</td></tr>'}</table></div><div class="bar" style="margin-top:12px"><button class="b" onclick="$('#dlg').close()">Fechar</button></div>`;d.showModal()}
/* ---------- dashboard ---------- */
function vDash(){const A=D.members.filter(m=>m.ativo),I=D.members.length-A.length,rs=A.map(m=>m.res),nm=v=>A.filter(m=>m.res==v).map(m=>m.nome).join(', '),now=new Date().toISOString().slice(0,10);
const nxt=D.wars.filter(w=>w.status=='agendada'&&w.data>=now).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora))[0],done=D.wars.filter(w=>w.status=='realizada');
const cls=CL.map(c=>[c,A.filter(m=>m.classe==c).length]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])),mx=Math.max(1,...cls.map(x=>x[1]));
const rk=A.map(m=>({m,...stats(m.id,done)})).filter(r=>r.t),avg=rk.filter(r=>r.pc!=null);const mp=avg.length?Math.round(avg.reduce((a,r)=>a+r.pc,0)/avg.length)+'%':'—';
const best=[...avg].sort((a,b)=>b.pc-a.pc).slice(0,5),worst=[...avg].sort((a,b)=>a.pc-b.pc).slice(0,5);
const bars=L=>L.map(r=>`<div class="hb"><span>${esc(r.m.nome)}</span><i style="width:${r.pc*1.4}px"></i>${r.pc}%</div>`).join('')||'<p class="mu">Sem dados de frequência.</p>';
let nx='<p class="mu">Nenhuma guerra agendada.</p>';if(nxt){const l=D.lineups.find(x=>x.id==nxt.id),n=l?l.teams.flat().length:0,full=l?l.teams.filter((t,i)=>t.length==CAP[i]).length:0;nx=`<b style="font-size:18px;color:var(--gold)">${esc(nxt.nome)}</b><br>${fmtD(nxt)}<br>Disponíveis: ${A.filter(m=>m.disp=='Sim').length} · Times completos: ${full}/12 · Escalados: ${n}/45<br><span class="mu">${n==45?'Organização completa':n?'Em montagem':'Sem times montados'}</span>`}
return`<div class="hero"><div class="ht"><b class="metal">BLACKANGELS</b><span>SOMBRAS ◆ HONRA ◆ LEALDADE ◆ PODER</span></div></div><h2>Dashboard</h2><div class="card"><h3>Próxima guerra</h3>${nx}</div><div class="grid">${[['Ativos',A.length],['Inativos',I],['Ress. média',rs.length?Math.round(rs.reduce((a,b)=>a+b,0)/rs.length):0],['Maior ress.',rs.length?Math.max(...rs):0,rs.length?nm(Math.max(...rs)):''],['Menor ress.',rs.length?Math.min(...rs):0,rs.length?nm(Math.min(...rs)):''],['Guerras realizadas',done.length],['Participação média',mp]].map(k=>`<div class="card k"><b>${k[1]}</b><span>${k[0]}</span>${k[2]?`<div style="margin-top:4px;color:var(--gold2);font-size:12px;overflow-wrap:anywhere">${esc(k[2])}</div>`:''}</div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Membros por classe</h3>${cls.map(c=>`<div class="hb"><span>${c[0]}</span><i style="width:${c[1]/mx*140}px"></i>${c[1]}</div>`).join('')}</div><div class="card"><h3>Top 5 participação</h3>${bars(best)}</div><div class="card"><h3>Menor participação</h3>${bars(worst)}</div></div>`}
/* ---------- config ---------- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cc'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const DEFG={lider:'亗Lagertha亗',oficiais:['Erikbloodaxe','ニ长Ҵモ几ニ','乃alerioи','么DARKFLAMINGO么','Ryero'],zap:'https://chat.whatsapp.com/DWgS46IqO4j9fntze95dDy',discord:'https://discord.gg/XjEjFax5k6'};
let G={...DEFG};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const minfo=n=>{const m=D.members.find(x=>x.nome.toLowerCase()==n.toLowerCase());return m?esc(m.classe)+' · Nv '+m.nivel+' · Ress. '+m.res:'não cadastrado como membro'};
function vCfg(){const lk=(t,d,u)=>`<div class="card"><h3>${t}</h3><p class="mu" style="margin:0 0 10px">${d}</p>${safeUrl(u)?`<div class="mu" style="margin-bottom:8px;overflow-wrap:anywhere">${esc(u)}</div><button class="b" data-u="${esc(u)}" onclick="window.open(this.dataset.u,'_blank','noopener')">Abrir link</button>`:'<span class="mu">Link ainda não cadastrado.</span>'}</div>`;
return`<h2>Gestão</h2><div class="bar"><button class="b" onclick="gForm()">Editar gestão</button></div>
<div class="g2"><div class="card"><h3>Líder do clã</h3><div class="metal" style="font:900 22px var(--f);letter-spacing:1px;margin-bottom:4px">${esc(G.lider)}</div><div class="mu">${minfo(G.lider)}</div></div>
<div class="card"><h3>Oficiais</h3>${G.oficiais.map(n=>`<div class="slot"><span>${esc(n)}</span><span class="mu">${minfo(n)}</span></div>`).join('')||'<p class="mu">Nenhum oficial cadastrado.</p>'}</div></div>
<h3>Links do clã</h3><div class="g2">${lk('3.1 · Grupo WhatsApp','Link de convite do grupo do clã.',G.zap)}${lk('3.2 · Discord','Link de convite do servidor.',G.discord)}</div>`}
function gForm(){form('Editar gestão',[{k:'lider',l:'Líder do clã'},{k:'oficiais',l:'Oficiais (um por linha)',t:'area'},{k:'zap',l:'Link do grupo WhatsApp'},{k:'discord',l:'Link do Discord'}],{lider:G.lider,oficiais:G.oficiais.join('\n'),zap:G.zap,discord:G.discord},o=>{
if(!o.lider)return'Informe o líder do clã';if(o.zap&&!safeUrl(o.zap))return'O link do WhatsApp deve começar com http:// ou https://';if(o.discord&&!safeUrl(o.discord))return'O link do Discord deve começar com http:// ou https://';
G={lider:o.lider,oficiais:o.oficiais.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),zap:o.zap,discord:o.discord};put('meta',{id:'gestao',...G}).then(()=>{render();toast('Gestão salva')})})}
function vBkp(){return`<h2>Backup</h2><div class="card"><h3>Backup</h3><div class="bar"><button class="b" onclick="exp()">Exportar JSON</button><button class="b" onclick="$('#imp').click()">Importar backup</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"><button class="b r" onclick="wipe()">Apagar tudo</button></div><p class="mu">A importação valida o arquivo e mescla por identificador, sem duplicar registros. O backup inclui os dados de Gestão.</p></div>`}
function exp(){const b=new Blob([JSON.stringify({app:'clan-command',v:1,at:new Date().toISOString(),gestao:G,...D},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='clan-command-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{let j;try{j=JSON.parse(r.result)}catch{return toast('JSON inválido')}
if(j.app!='clan-command'||!['members','wars','lineups','attend'].every(k=>Array.isArray(j[k]))||j.members.some(m=>!m.id||!m.nome||!CL.includes(m.classe))||j.wars.some(w=>!w.id||!w.data))return toast('Backup inválido: estrutura incorreta');
if(!confirm(`Importar ${j.members.length} membros e ${j.wars.length} guerras? Registros com o mesmo ID serão sobrescritos.`))return;let n=0;for(const k of ['members','wars','lineups','attend'])for(const o of j[k]){await put(k,o);n++}if(j.gestao&&typeof j.gestao.lider=='string')await put('meta',{...j.gestao,id:'gestao'});await load();render();toast(n+' registros importados')};r.readAsText(f)}
function wipe(){ask('Apagar TODOS os dados? Exporte um backup antes. Irreversível.',()=>ask('Confirma novamente: apagar tudo?',async()=>{for(const n of Object.keys(D))for(const o of D[n])await rm(n,o.id);await load();render();toast('Dados apagados')}))}
function setPin(){form('Novo PIN',[{k:'p',l:'PIN (4+ dígitos)',t:'password'}],{},o=>{if(!/^\d{4,}$/.test(o.p))return'Use 4 ou mais dígitos';sha(o.p).then(h=>put('meta',{id:'pin',v:h})).then(()=>toast('PIN salvo'))})}
const AUTH='7559cf7517e5e1b4d7ee38742053d85d43c9dbccf0b05c93af6e7a2e04e802c2';
const lh=async(u,p)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ba|'+u.trim().toLowerCase()+'|'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function unlock(){const u=$('#lu').value,p=$('#pin').value;if(await lh(u,p)==AUTH){try{sessionStorage.setItem('ba_ok',AUTH)}catch{}$('#lock').style.display='none';$('#pin').value='';start()}else{toast('Login ou senha incorretos');$('#lerr').textContent='Login ou senha incorretos';$('#pin').value=''}}
function logout(){try{sessionStorage.removeItem('ba_ok')}catch{}location.reload()}
/* ---------- app ---------- */
const V={dash:vDash,wars:vWars,mem:vMem,teams:vTeams,att:vAtt,cfg:vCfg,bkp:vBkp};
function go(v){view=v;render()}
function render(){$('#nav').innerHTML='<h1><div class="crest"></div><span class="metal">BLACKANGELS</span><small>Sombras · Honra · Lealdade · Poder</small></h1>'+NAV.map(n=>`<button class="${n[0]==view?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')+'<button onclick="logout()">⏻ Sair</button>';$('#m').innerHTML=V[view]();if(view=='mem')memTbl();if(view=='att')att2()}
function start(){load().then(render)}
(async()=>{try{db=await opn()}catch{$('#m').innerHTML='<p>IndexedDB indisponível neste navegador.</p>';return}
let ok=false;try{ok=sessionStorage.getItem('ba_ok')==AUTH}catch{}if(ok)start();else{$('#lock').style.display='flex';setTimeout(()=>$('#lu').focus(),50)}})();
</script></body></html>
